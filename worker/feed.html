<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pullit feed</title>
<meta name="description" content="what the box posted on x and everything it did, live.">
<meta name="theme-color" content="#0a090b">
<link rel="icon" href="data:image/svg+xml,BOXSVG_URI">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--bg:#0a090b;--panel:#141114;--line:#2a2329;--ink:#120a10;--pink:#ff8dc0;--shadow:#6a2a4c;--text:#f6eff9;--muted:#9a8f99;--dim:#7f747e;--mint:#7be0c3;--gold:#ffc94d}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.5 'Space Mono',ui-monospace,monospace;min-height:100vh;
background-image:radial-gradient(rgba(255,141,192,.10) 1px,transparent 1.4px);background-size:8px 8px}
a{color:inherit;text-decoration:none}
.wrap{width:100%;max-width:1180px;margin:0 auto;padding:0 16px 40px}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 0}
.back{font:400 14px 'Silkscreen',monospace;display:inline-flex;align-items:center;gap:8px}
.back img{width:28px;image-rendering:pixelated}
.chip{border:2px solid var(--line);color:var(--muted);padding:6px 10px;font-size:12px;display:inline-flex;align-items:center;min-height:36px}
.chip:hover{border-color:var(--pink);color:var(--text)}
nav{display:flex;gap:6px}
h1{font:400 26px/1.1 'Silkscreen',monospace;margin:6px 0 18px}
h2{font:400 13px 'Silkscreen',monospace;margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 a{font:12px 'Space Mono',monospace;color:var(--muted)}h2 a:hover{color:var(--pink)}
.grid{display:grid;gap:28px}
@media (min-width:900px){.wrap{padding:0 40px 48px}.grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}h1{font-size:34px}}
.xf{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.xf li{border:2px solid var(--line);background:var(--panel);font-size:12px;line-height:1.5;white-space:pre-line}
.xf li.empty{border:0;background:none;color:var(--muted)}
.xf a{display:block;padding:10px 12px}
.xf li:hover{border-color:var(--pink)}
.xf time{display:block;margin-top:6px;color:var(--muted);font-size:11px}
.xm{display:grid;gap:6px;margin-top:10px}.xm.two{grid-template-columns:1fr 1fr}
.xm img,.xm video{width:100%;max-height:260px;object-fit:cover;display:block;border:2px solid var(--line);background:#000}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:12px}
.log li{display:grid;grid-template-columns:40px 50px minmax(0,1fr);gap:8px;line-height:1.45;align-items:baseline}
.log .t{color:var(--dim)}
.log .tag{font-size:10px;border:1px solid;text-align:center}
.log .m{color:var(--muted)}
.log .m.hi{color:var(--text)}.log .m.rd{color:#ff6b6b}.log .m.mt{color:var(--mint)}.log .m.pk{color:var(--pink)}.log .m.gd{color:var(--gold)}.log .m.or{color:#ff9a4d}
.log a.tx{color:var(--pink);margin-left:6px;white-space:nowrap}
.tabs{display:none}
@media (max-width:899px){
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:0 0 14px}
  .tabs button{background:none;border:2px solid var(--line);color:var(--muted);padding:9px 0;font:400 12px 'Silkscreen',monospace;cursor:pointer}
  .tabs button[aria-pressed="true"]{border-color:var(--pink);color:var(--text)}
  .grid section[hidden]{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="back" href="/"><img src="data:image/svg+xml,BOXSVG_URI" alt="">← pullit</a>
  <nav><a class="chip" href="https://x.com/Pullitbox" target="_blank" rel="noopener">follow on x</a></nav>
</header>
<h1>feed</h1>
<div class="tabs"><button type="button" data-tab="x" aria-pressed="true">on x</button><button type="button" data-tab="log" aria-pressed="false">live log</button></div>
<div class="grid">
  <section id="tab-x">
    <h2>on x <a href="https://x.com/Pullitbox" target="_blank" rel="noopener">@Pullitbox ↗</a></h2>
    <div id="xPins"></div>
    <ol class="xf" id="xFeed"><li class="empty">the box posts every big pull here</li></ol>
  </section>
  <section id="tab-log">
    <h2>live log <span class="t" style="font:11px 'Space Mono',monospace;color:var(--dim)">newest first</span></h2>
    <ol class="log" id="feed"><li><span></span><span></span><span class="m">loading…</span></li></ol>
  </section>
</div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = document.createElement(tag); Object.assign(e, props); e.append(...kids); return e; };
const ago = (iso) => { const m = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 60000)); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + 'h ago' : Math.round(m / 1440) + 'd ago'; };
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
const TAG = { fee: '#7be0c3', scan: '#9a8f99', pick: '#8ec5ff', box: '#ff8dc0', draw: '#ffc94d', win: '#ff8dc0', sent: '#9a8f99', info: '#9a8f99', roast: '#ff6b6b', hold: '#7be0c3', x: '#f4eef2', boost: '#ffc94d', burn: '#ff9a4d' };
const MSG = { boost: 'gd', burn: 'or', x: 'hi', pick: 'hi', box: 'pk', win: 'pk', draw: 'gd', roast: 'rd', hold: 'mt' };
const Q = /[?&]preview=/.test(location.search) ? location.search : '';
const render = {};
function draw(s) {
  // pinned tweets first, like the bot's own posts
  const P = (s.pins || []).filter((p) => p.text);
  const pkey = P.map((p) => p.url).join();
  if (pkey !== render.pkey) {
    render.pkey = pkey;
    $('xPins').replaceChildren(...P.map((p) => el('ol', { className: 'xf', style: 'margin-bottom:8px' }, el('li', {}, el('a', { href: p.url, target: '_blank', rel: 'noopener' },
      el('span', { textContent: p.text }),
      ...(p.media && p.media.length ? [el('span', { className: 'xm' + (p.media.length > 1 ? ' two' : '') }, ...p.media.slice(0, 2).map((m) => m.type === 'video'
        ? Object.assign(el('video', { src: m.src, poster: m.poster || '', muted: true, loop: true, playsInline: true, autoplay: true, preload: 'metadata' }), { onclick: (e) => e.preventDefault() })
        : el('img', { src: m.src, alt: '', loading: 'lazy' })))] : []),
      el('time', { textContent: (p.at ? p.at.toLowerCase() + ' · ' : '') + 'pinned · open on x ↗' }))))));
    for (const v of $('xPins').querySelectorAll('video')) { v.muted = true; v.play?.().catch(() => {}); }
  }
  const X = s.x || [];
  const xkey = X.length ? X[0].at + X.length : 'none' + P.length;
  if (xkey !== render.xkey) {
    render.xkey = xkey;
    if (X.length) $('xFeed').replaceChildren(...X.map((p) => el('li', {}, el('a', { href: p.url || 'https://x.com/Pullitbox', target: '_blank', rel: 'noopener' },
      p.text, el('time', { textContent: ago(p.at) + ' · open on x ↗' })))));
    else if (P.length) $('xFeed').replaceChildren();
  }
  const feed = s.feed || [];
  const fkey = feed.length ? feed[0].at + feed.length : '';
  if (fkey !== render.fkey) {
    render.fkey = fkey;
    $('feed').replaceChildren(...(feed.length ? feed : [{ at: '', tag: '', m: 'quiet so far. the box talks here once fees come in' }]).map((f) => {
      const m = el('span', { className: 'm ' + (MSG[f.tag] || ''), textContent: f.m });
      if (f.tx && f.tx !== 'dry-run') m.append(el('a', { className: 'tx', href: 'https://solscan.io/tx/' + f.tx, target: '_blank', rel: 'noopener', textContent: 'tx ↗' }));
      return el('li', {}, el('span', { className: 't', textContent: f.at ? hhmm(f.at) : '' }),
        f.tag ? el('span', { className: 'tag', textContent: f.tag, style: `color:${TAG[f.tag] || '#9a8f99'};border-color:${TAG[f.tag] || '#9a8f99'}` }) : el('span'), m);
    }));
  }
}
async function load() { try { draw(await fetch('/api/state' + Q, { cache: 'no-store' }).then((r) => r.json())); } catch {} }
load(); setInterval(load, 10_000);
document.querySelectorAll('.tabs button').forEach((b) => b.onclick = () => {
  document.querySelectorAll('.tabs button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
  $('tab-x').hidden = b.dataset.tab !== 'x'; $('tab-log').hidden = b.dataset.tab !== 'log';
});
if (matchMedia('(max-width:899px)').matches) $('tab-log').hidden = true;
</script>
</body>
</html>
